name: Run Weather API Test Slate

on:
  workflow_dispatch:

jobs:
  run-test-slate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Test Script
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          THE_WEATHER_API_KEY: ${{ secrets.THE_WEATHER_API_KEY }}
        run: python scripts/test_apis.py

      - name: Commit and Push test_index.html
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add test_index.html
          git commit -m "🧪 Update API comparison test slate [skip ci]" || echo "No changes to commit"
          git push
